<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>Tài Xỉu - Game Kinh Dị</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Main Menu -->
        <div id="menu" class="screen active">
            <div class="glitch-wrapper">
                <h1 class="glitch" data-text="TÀI XỈU">TÀI XỈU</h1>
            </div>
            <p class="subtitle">Bạn có dám chơi không?</p>
            <button class="btn-start" onclick="startGame()">BẮT ĐẦU</button>
            <div class="warning">⚠️ Cảnh báo: Game chứa nội dung kinh dị và âm thanh đột ngột</div>
        </div>

        <!-- Game Screen -->
        <div id="game" class="screen">
            <div class="score-board">
                <div class="score-item">
                    <span class="label">Điểm:</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">Thắng:</span>
                    <span id="wins" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">Thua:</span>
                    <span id="losses" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">Streak:</span>
                    <span id="streak" class="value">-</span>
                </div>
                <div class="score-item">
                    <span class="label">High:</span>
                    <span id="high-score" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">🏆:</span>
                    <span id="achievement-count" class="value">0/22</span>
                </div>
            </div>

            <div class="game-area">
                <div id="coin-container" class="coin-container">
                    <div class="coin">
                        <div class="coin-face front">NGỬA</div>
                        <div class="coin-face back">ỬA</div>
                    </div>
                </div>

                <div class="message-box">
                    <p id="message">Hãy chọn NGÚP hoặc ỬA...</p>
                </div>

                <div class="choice-buttons">
                    <button class="btn-choice" onclick="makeChoice('NGÚP')" id="btn-ngup">
                        <span>NGÚP</span>
                        <div class="btn-glow"></div>
                    </button>
                    <button class="btn-choice" onclick="makeChoice('ỬA')" id="btn-ua">
                        <span>ỬA</span>
                        <div class="btn-glow"></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Jumpscare Overlay -->
        <div id="jumpscare" class="jumpscare-overlay">
            <div class="jumpscare-content">
                <img id="jumpscare-image" src="" alt="">
                <div class="static-noise"></div>
            </div>
        </div>

        <!-- Victory Animation Overlay -->
        <div id="victory" class="victory-overlay">
            <div class="victory-content">
                <div class="victory-text" id="victory-text"></div>
            </div>
        </div>

        <!-- Results Display -->
        <div id="results" class="results-display">
            <div class="result-coins">
                <div class="result-coin" id="result-1"></div>
                <div class="result-coin" id="result-2"></div>
                <div class="result-coin" id="result-3"></div>
                <div class="result-coin" id="result-4"></div>
            </div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="bg-music" loop>
        <source src="assets/audio/bg-music.mp3" type="audio/mpeg">
    </audio>
    <audio id="coin-flip-sound">
        <source src="assets/audio/coin-flip.mp3" type="audio/mpeg">
    </audio>
    <audio id="jumpscare-sound">
        <source src="assets/audio/jumpscare.mp3" type="audio/mpeg">
    </audio>
    <audio id="victory-sound">
        <source src="assets/audio/victory.mp3" type="audio/mpeg">
    </audio>
    <audio id="ambient-sound">
        <source src="assets/audio/ambient.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
